#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "wikimore"
name = "Wikimore"
description.en = "Simple frontend for Wikimedia projects"
description.fr = "Interface simple pour les projets Wikimedia"

version = "0.1.27~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
demo = "https://wikimore.private.coffee/"
code = "https://git.private.coffee/privatecoffee/wikimore"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

[resources.sources.main]
    url = "https://git.private.coffee/privatecoffee/wikimore/archive/v0.1.27.tar.gz"
    sha256 = "6fe9490f99d560cb989216dfc701708cce3ba911174dcb1809a75a687102cb99"
    autoupdate.strategy = "latest_gitea_tag"
    prefetch = false

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "python3-dev, python3-venv, python3, python3-pip, libcurl4-openssl-dev, libssl-dev"
